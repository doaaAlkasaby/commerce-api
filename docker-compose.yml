services:
  postgres:
    image: postgres:17
    container_name: commerce-api-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerce_api
      POSTGRES_USER: commerce_user
      POSTGRES_PASSWORD: commerce_password

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce_user -d commerce_api']
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17
    container_name: commerce-api-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: commerce_api_test
      POSTGRES_USER: commerce_test_user
      POSTGRES_PASSWORD: commerce_test_password

    ports:
      - '5433:5432'

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U commerce_test_user -d commerce_api_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_test_data:
